<style>
  .payment-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 90vh;
  background: linear-gradient(135deg, #e0f7fa, #fffde7);
}

.payment-card {
  background: white;
  padding: 30px 40px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
  width: 400px;
  text-align: center;
  transition: transform 0.3s ease;
}

.payment-card:hover {
  transform: translateY(-5px);
}

.payment-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logout-btn {
  background: #ff5252;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.logout-btn:hover {
  background: #e53935;
}

.payment-body h3 {
  margin-top: 20px;
  color: #333;
  font-weight: 600;
}

.amount {
  font-size: 2rem;
  font-weight: bold;
  color: #00796b;
  margin: 10px 0 20px 0;
}

.pay-btn {
  background: #007bff;
  color: white;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.2s;
}

.pay-btn:hover {
  background: #0056b3;
  transform: scale(1.05);
}

.note {
  font-size: 0.9rem;
  color: #555;
  margin-top: 20px;
  background: #f9f9f9;
  padding: 10px;
  border-radius: 10px;
}

</style>
<div class="payment-container">
  <div class="payment-card">
    <div class="payment-header">
      <h2>💳 Razorpay Payment</h2>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>

    <div class="payment-body">
      <h3>Amount to Pay</h3>
      <p class="amount">₹500</p>

      <button class="pay-btn" (click)="payNow()">Pay Now</button>

      <p class="note">
        ⚠️ This is a demo transaction using a test key.  
        For production, please create an order on your backend and use the actual <b>order_id</b>.
      </p>
    </div>
  </div>
</div>
