<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register & Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #444;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .success-message {
      margin-top: 15px;
      color: green;
      text-align: center;
      font-weight: 500;
    }

    .divider {
      height: 2px;
      background: #eee;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="container" >
    <!-- REGISTER FORM -->
     
 

    <div class="divider" *ngIf="userlogin"></div>

    <!-- LOGIN FORM -->
    <h2>LOGIN</h2>
    <div class="form-group">
      <label>User Name</label>
      <input type="text" [(ngModel)]="userD.UserName" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="userD.Password" />
    </div>

    <div class="form-group">
      <label><input type="checkbox" [(ngModel)]="isactive" (change)="onRememberMeChange($event)" />
      Remember Me
    </label>
    
    </div>
    <!-- <div class="form-check">
  <input 
    class="form-check-input" 
    type="checkbox" 
    id="activeCheck" 
    [(ngModel)]="isactive" />
  <label class="form-check-label" for="activeCheck">
    Active
  </label>
</div> -->

<!-- <p>Checkbox is: {{ isactive ? 'Checked' : 'Unchecked' }}</p> -->

    <button (click)="Submit()">Login</button>
    <a routerLink="/ForgotPassword">Forgot Password</a>
    <div *ngIf="login" class="success-message">
      User Logged In Successfully
    </div>
  </div>
  <router-outlet></router-outlet>

</body>
</html>
