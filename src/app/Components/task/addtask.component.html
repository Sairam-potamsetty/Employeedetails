<!DOCTYPE html>
<html>
    <body>
        <div>
            <input type="text" [(ngModel)]="User.username"/><br>
            <input type="text" [(ngModel)]="User.salary"/><br>
            <input type="text" [(ngModel)]="User.userrole"/><br>
            <button (click)="save()">Save</button>

        </div>
<div *ngFor="let i of user">
<ul>
    <li>{{i.username | ntc }}</li>
    <li>{{i.salary | currency:'USD'}}</li>
    <li appHighlight >{{i.userrole}}</li>
</ul>
</div>
    </body>
</html>
