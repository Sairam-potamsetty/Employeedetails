<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <img src="https://upload.wikimedia.org/wikipedia/en/thumb/f/fc/State_Bank_of_India_logo.svg/1200px-State_Bank_of_India_logo.svg.png"
           alt="SBI Logo"
           width="70" class="mb-3" />
      <h4 class="fw-bold text-primary">SBI Payment Gateway (Mock)</h4>
      <p class="text-muted small">Secure Test Transaction</p>
    </div>

    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold">Amount (₹)</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white"><i class="bi bi-currency-rupee"></i></span>
          <input type="number" [(ngModel)]="paymentdetails.amount" name="amount" class="form-control" placeholder="Enter amount" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white"><i class="bi bi-envelope"></i></span>
          <input type="email" [(ngModel)]="paymentdetails.email" name="email" class="form-control" placeholder="you@example.com" />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Phone</label>
        <div class="input-group">
          <span class="input-group-text bg-primary text-white"><i class="bi bi-telephone"></i></span>
          <input type="text" [(ngModel)]="paymentdetails.phone" name="phone" class="form-control" placeholder="Enter mobile number" />
        </div>
      </div>

      <button type="button" (click)="makePayment()" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-credit-card me-2"></i>Pay ₹{{ paymentdetails.amount || 0 }} (Mock SBI)
      </button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">All transactions are encrypted and secure (Mock Environment)</small>
    </div>
  </div>
</div>
