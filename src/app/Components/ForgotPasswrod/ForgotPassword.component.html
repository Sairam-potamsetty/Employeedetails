<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forgot Password</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #74b9ff, #a29bfe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .container {
        background: #fff;
        padding: 40px 50px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        width: 350px;
        text-align: center;
      }

      h2 {
        color: #2d3436;
        margin-bottom: 25px;
      }

      label {
        display: block;
        font-weight: 600;
        text-align: left;
        margin-bottom: 8px;
        color: #636e72;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 18px;
        border: 1px solid #dcdde1;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        transition: 0.3s;
      }

      input:focus {
        border-color: #0984e3;
        box-shadow: 0 0 5px rgba(9, 132, 227, 0.4);
      }

      button {
        background-color: #0984e3;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: 0.3s;
      }

      button:hover {
        background-color: #74b9ff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Forgot Password</h2>
      <div>
        <label>New Password</label>
        <input
          type="password"
          placeholder="Enter new password"
          [(ngModel)]="Forgot.newpassword1"
        />

        <label>Re-enter Password</label>
        <input
          type="password"
          placeholder="Re-enter new password"
          [(ngModel)]="Forgot.newpassword2"
        />

        <button (click)="Forgotpass()" >Change Password</button>
          <a routerLink="/UserLoginComponent" >Login</a>
      </div>
    </div>
  </body>
</html>
